name: Release

# Pushing a vX.Y.Z tag runs the checks and publishes a GitHub release. The
# Traefik plugin catalog picks up new tags on its own (it polls GitHub daily).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GOPATH: ${{ github.workspace }}/go
      YAEGI_VERSION: v0.16.1
      TRAEFIK_VERSION: v3.7.13
    defaults:
      run:
        working-directory: ${{ github.workspace }}/go/src/github.com/KaHooli/Traefik-plugin-cloudflare-ddns
    steps:
      - uses: actions/checkout@v4
        with:
          path: go/src/github.com/KaHooli/Traefik-plugin-cloudflare-ddns
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Check tag matches CHANGELOG
        run: |
          grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || {
            echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME}"; exit 1; }

      - name: go test
        run: go test -race -count=1 ./...

      - name: yaegi test
        run: |
          go install github.com/traefik/yaegi/cmd/yaegi@${YAEGI_VERSION}
          GO111MODULE=off "$GOPATH/bin/yaegi" test .

      - name: Catalog smoke test
        run: |
          curl -fsSL -o "$RUNNER_TEMP/traefik.tgz" "https://github.com/traefik/traefik/releases/download/${TRAEFIK_VERSION}/traefik_${TRAEFIK_VERSION}_linux_amd64.tar.gz"
          tar -xzf "$RUNNER_TEMP/traefik.tgz" -C "$RUNNER_TEMP" traefik
          python3 -m pip install --quiet pyyaml
          python3 .github/scripts/catalog_smoke.py "$RUNNER_TEMP/traefik"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Release notes: this version's CHANGELOG section.
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag \
            --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
